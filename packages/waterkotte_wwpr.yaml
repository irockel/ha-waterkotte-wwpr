# Waterkotte heat pump with WWPR controller (Carel pCO) via a Carel pCOWeb card, Modbus TCP.
# Home Assistant package - see README.md. Generated from the author's live setup.
#
# Before use:
#   - modbus -> host: address of your pCOWeb card (with pcoweb-mbproxy on port 502)
#   - script.wp_benachrichtigen: where messages go (default: notifications in Home Assistant)
#
# Writes to the heat pump only go through script.wp_register_schreiben (write, wait for the read-back,
# at most one more attempt). The zero checks (nan_value 0x0000, "block valid" conditions in the templates)
# keep the values stable when the card runs the stock pcod, whose dropouts read as all-zero blocks.
modbus:
  - name: waterkotte
    type: tcp
    host: 192.0.2.10        # <- address of your pCOWeb card
    port: 502
    timeout: 5
    sensors:
      - name: "WP Außentemperatur"
        unique_id: wp_temp_aussen
        address: 1
        input_type: holding
        data_type: int16
        scale: 0.1
        precision: 1
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        scan_interval: 10
        nan_value: "0x0000"
      - name: "WP Außentemperatur 24h"
        unique_id: wp_temp_aussen_24h
        address: 3
        input_type: holding
        data_type: int16
        scale: 0.1
        precision: 1
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        scan_interval: 10
        nan_value: "0x0000"
      - name: "WP Vorlauf"
        unique_id: wp_temp_vl
        address: 12
        input_type: holding
        data_type: int16
        scale: 0.1
        precision: 1
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        scan_interval: 10
        nan_value: "0x0000"
      - name: "WP Rücklauf"
        unique_id: wp_temp_rl
        address: 11
        input_type: holding
        data_type: int16
        scale: 0.1
        precision: 1
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        scan_interval: 10
        nan_value: "0x0000"
      - name: "WP Warmwasser"
        unique_id: wp_temp_ww
        address: 19
        input_type: holding
        data_type: int16
        scale: 0.1
        precision: 1
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        scan_interval: 10
        nan_value: "0x0000"
      - name: "WP Warmwasser Soll"
        unique_id: wp_temp_ww_soll
        address: 37
        input_type: holding
        data_type: int16
        scale: 0.1
        precision: 1
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        scan_interval: 10
        nan_value: "0x0000"
      - name: "WP Heizkreis Ist"
        unique_id: wp_temp_hk_ist
        address: 30
        input_type: holding
        data_type: int16
        scale: 0.1
        precision: 1
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        scan_interval: 10
        nan_value: "0x0000"
      - name: "WP Heizkreis Soll"
        unique_id: wp_temp_hk_soll
        address: 31
        input_type: holding
        data_type: int16
        scale: 0.1
        precision: 1
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        scan_interval: 10
        nan_value: "0x0000"
      - name: "WP Statusblock"
        unique_id: wp_raw_statusblock
        address: 158
        count: 24
        input_type: holding
        data_type: custom
        structure: ">24H"
        scan_interval: 10
      - name: "WP Leistungsblock"
        unique_id: wp_raw_leistungsblock
        address: 51
        count: 8
        input_type: holding
        data_type: custom
        structure: ">8H"
        scan_interval: 10
      - name: "WP Warmwasserblock"
        unique_id: wp_raw_warmwasserblock
        address: 37
        count: 2
        input_type: holding
        data_type: custom
        structure: ">2h"
        scan_interval: 10
      - name: "WP Kennlinienblock"
        unique_id: wp_raw_kennlinienblock
        address: 91
        count: 6
        input_type: holding
        data_type: custom
        structure: ">6h"
        scan_interval: 10
      # A107 Schaltdifferenz Kühlen, A108 Kühlgrenze (24 h outside), A109 Kühlkreis Soll (return)
      - name: "WP Kühlblock"
        unique_id: wp_raw_kuehlblock
        address: 107
        count: 3
        input_type: holding
        data_type: custom
        structure: ">3h"
        scan_interval: 30
      # A61 Schaltdifferenz Heizen (raw, x10)
      - name: "WP Heizen Schaltdifferenz"
        unique_id: wp_raw_heizen_schaltdifferenz
        address: 61
        input_type: holding
        data_type: int16
        scan_interval: 30
template:
  - trigger:
      - trigger: state
        entity_id:
          - sensor.wp_aussentemperatur
          - sensor.wp_aussentemperatur_24h
          - sensor.wp_vorlauf
          - sensor.wp_rucklauf
          - sensor.wp_warmwasser
          - sensor.wp_warmwasser_soll
          - sensor.wp_heizkreis_ist
          - sensor.wp_heizkreis_soll
      - trigger: time_pattern
        minutes: "/1"
    sensor:
      - name: "Wärmepumpe Außentemperatur"
        unique_id: waermepumpe_aussentemperatur
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        availability: >
          {% set e = states.sensor.wp_aussentemperatur %}
          {{ e is not none and (e.state != 'unavailable'
             or (now() - e.last_changed).total_seconds() < 600) }}
        state: >
          {% set v = states('sensor.wp_aussentemperatur') %}
          {{ v if is_number(v) else (this.state if is_number(this.state) else none) }}
      - name: "Wärmepumpe Außentemperatur 24h"
        unique_id: waermepumpe_aussentemperatur_24h
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        availability: >
          {% set e = states.sensor.wp_aussentemperatur %}
          {{ e is not none and (e.state != 'unavailable'
             or (now() - e.last_changed).total_seconds() < 600) }}
        state: >
          {% set v = states('sensor.wp_aussentemperatur_24h') %}
          {{ v if is_number(v) else (this.state if is_number(this.state) else none) }}
      - name: "Wärmepumpe Vorlauf"
        unique_id: waermepumpe_vorlauf
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        availability: >
          {% set e = states.sensor.wp_aussentemperatur %}
          {{ e is not none and (e.state != 'unavailable'
             or (now() - e.last_changed).total_seconds() < 600) }}
        state: >
          {% set v = states('sensor.wp_vorlauf') %}
          {{ v if is_number(v) else (this.state if is_number(this.state) else none) }}
      - name: "Wärmepumpe Rücklauf"
        unique_id: waermepumpe_ruecklauf
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        availability: >
          {% set e = states.sensor.wp_aussentemperatur %}
          {{ e is not none and (e.state != 'unavailable'
             or (now() - e.last_changed).total_seconds() < 600) }}
        state: >
          {% set v = states('sensor.wp_rucklauf') %}
          {{ v if is_number(v) else (this.state if is_number(this.state) else none) }}
      - name: "Wärmepumpe Warmwasser"
        unique_id: waermepumpe_warmwasser
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        availability: >
          {% set e = states.sensor.wp_aussentemperatur %}
          {{ e is not none and (e.state != 'unavailable'
             or (now() - e.last_changed).total_seconds() < 600) }}
        state: >
          {% set v = states('sensor.wp_warmwasser') %}
          {{ v if is_number(v) else (this.state if is_number(this.state) else none) }}
      - name: "Wärmepumpe Warmwasser Soll"
        unique_id: waermepumpe_warmwasser_soll
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        availability: >
          {% set e = states.sensor.wp_aussentemperatur %}
          {{ e is not none and (e.state != 'unavailable'
             or (now() - e.last_changed).total_seconds() < 600) }}
        state: >
          {% set v = states('sensor.wp_warmwasser_soll') %}
          {{ v if is_number(v) else (this.state if is_number(this.state) else none) }}
      - name: "Wärmepumpe Heizkreis Ist"
        unique_id: waermepumpe_heizkreis_ist
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        availability: >
          {% set e = states.sensor.wp_aussentemperatur %}
          {{ e is not none and (e.state != 'unavailable'
             or (now() - e.last_changed).total_seconds() < 600) }}
        state: >
          {% set v = states('sensor.wp_heizkreis_ist') %}
          {{ v if is_number(v) else (this.state if is_number(this.state) else none) }}
      - name: "Wärmepumpe Heizkreis Soll"
        unique_id: waermepumpe_heizkreis_soll
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        availability: >
          {% set e = states.sensor.wp_aussentemperatur %}
          {{ e is not none and (e.state != 'unavailable'
             or (now() - e.last_changed).total_seconds() < 600) }}
        state: >
          {% set v = states('sensor.wp_heizkreis_soll') %}
          {{ v if is_number(v) else (this.state if is_number(this.state) else none) }}
  # "ok" = at least 8 of I30..I42 (HR 158..170) are 1 - false only for pcod's all-zero blocks (see above)
  - trigger:
      - trigger: state
        entity_id:
          - sensor.wp_statusblock
          - sensor.wp_leistungsblock
    binary_sensor:
      - name: "Wärmepumpe Verdichter"
        unique_id: waermepumpe_verdichter
        device_class: running
        icon: mdi:heat-pump
        state: >
          {% set r = states('sensor.wp_statusblock').split(',') | map('int', -1) | list %}
          {% set ok = r | length == 24 and (r[0:13] | select('eq', 1) | list | length) >= 8 %}
          {{ (r[21] | bitwise_and(8)) > 0 if ok else this.state == 'on' }}
      - name: "Wärmepumpe Heizungspumpe"
        unique_id: waermepumpe_heizungspumpe
        device_class: running
        icon: mdi:pump
        state: >
          {% set r = states('sensor.wp_statusblock').split(',') | map('int', -1) | list %}
          {% set ok = r | length == 24 and (r[0:13] | select('eq', 1) | list | length) >= 8 %}
          {{ (r[21] | bitwise_and(2)) > 0 if ok else this.state == 'on' }}
      - name: "Wärmepumpe Warmwasserbetrieb"
        unique_id: waermepumpe_warmwasserbetrieb
        icon: mdi:water-boiler
        state: >
          {% set r = states('sensor.wp_statusblock').split(',') | map('int', -1) | list %}
          {% set ok = r | length == 24 and (r[0:13] | select('eq', 1) | list | length) >= 8 %}
          {{ (r[21] | bitwise_and(256)) > 0 if ok else this.state == 'on' }}
      - name: "Wärmepumpe Kühlbetrieb"
        unique_id: waermepumpe_kuehlbetrieb
        icon: mdi:snowflake
        state: >
          {% set r = states('sensor.wp_statusblock').split(',') | map('int', -1) | list %}
          {% set ok = r | length == 24 and (r[0:13] | select('eq', 1) | list | length) >= 8 %}
          {{ (r[21] | bitwise_and(128)) > 0 if ok else this.state == 'on' }}
      - name: "Wärmepumpe Abtauung"
        unique_id: waermepumpe_abtauung
        icon: mdi:snowflake-melt
        state: >
          {% set r = states('sensor.wp_statusblock').split(',') | map('int', -1) | list %}
          {% set ok = r | length == 24 and (r[0:13] | select('eq', 1) | list | length) >= 8 %}
          {{ (r[21] | bitwise_and(4096)) > 0 if ok else this.state == 'on' }}
      - name: "Wärmepumpe EVU-Sperre"
        unique_id: waermepumpe_evu_sperre
        icon: mdi:transmission-tower-off
        state: >
          {% set r = states('sensor.wp_statusblock').split(',') | map('int', -1) | list %}
          {% set ok = r | length == 24 and (r[0:13] | select('eq', 1) | list | length) >= 8 %}
          {{ (r[23] | bitwise_and(4)) > 0 if ok else this.state == 'on' }}
      - name: "Wärmepumpe Unterbrechung"
        unique_id: waermepumpe_unterbrechung
        device_class: problem
        icon: mdi:pause-octagon
        state: >
          {% set r = states('sensor.wp_statusblock').split(',') | map('int', -1) | list %}
          {% set ok = r | length == 24 and (r[0:13] | select('eq', 1) | list | length) >= 8 %}
          {{ (r[23] | bitwise_and(65531)) > 0 if ok else this.state == 'on' }}
      - name: "Wärmepumpe Störung"
        unique_id: waermepumpe_stoerung
        device_class: problem
        icon: mdi:alert-octagon
        state: >
          {% set r = states('sensor.wp_statusblock').split(',') | map('int', -1) | list %}
          {% set ok = r | length == 24 and (r[0:13] | select('eq', 1) | list | length) >= 8 %}
          {{ ((r[22] | bitwise_and(49151)) > 0 or (r[21] | bitwise_and(64)) > 0) if ok else this.state == 'on' }}
  - sensor:
      - name: "Wärmepumpe Betriebszustand"
        unique_id: waermepumpe_betriebszustand
        icon: >
          {% set m = {'Störung':'mdi:alert-octagon','EVU-Sperre':'mdi:transmission-tower-off',
                      'Unterbrechung':'mdi:pause-octagon','Abtauen':'mdi:snowflake-melt',
                      'Warmwasser':'mdi:water-boiler','Kühlen':'mdi:snowflake','Heizen':'mdi:radiator',
                      'Zyklische Messung':'mdi:thermometer-water','Pumpenlauf':'mdi:pump',
                      'Bereit':'mdi:heat-pump-outline'} %}
          {{ m.get(this.state, 'mdi:heat-pump') }}
        state: >
          {% set r = states('sensor.wp_statusblock').split(',') | map('int', -1) | list %}
          {% set ok = r | length == 24 and (r[0:13] | select('eq', 1) | list | length) >= 8 %}
          {% if not ok %}{{ this.state if this.state not in ['unknown', 'unavailable'] else none }}
          {% else %}
            {% set st, ausf, unt = r[21], r[22], r[23] %}
            {% if (ausf | bitwise_and(49151)) > 0 or (st | bitwise_and(64)) > 0 %}Störung
            {% elif (unt | bitwise_and(4)) > 0 %}EVU-Sperre
            {% elif unt > 0 %}Unterbrechung
            {% elif (st | bitwise_and(4096)) > 0 %}Abtauen
            {% elif (st | bitwise_and(10)) > 0 and (st | bitwise_and(256)) > 0 %}Warmwasser
            {% elif (st | bitwise_and(8)) > 0 and (st | bitwise_and(128)) > 0 %}Kühlen
            {% elif (st | bitwise_and(8)) > 0 %}Heizen
            {% elif (st | bitwise_and(2)) > 0 %}
              {#- pump without compressor: overrun after compressor operation, otherwise the cyclic measurement -#}
              {{ 'Pumpenlauf' if this.state in ['Heizen', 'Warmwasser', 'Kühlen', 'Abtauen', 'Pumpenlauf']
                 else 'Zyklische Messung' }}
            {% else %}Bereit{% endif %}
          {% endif %}
        attributes:
          schaltzustand_i51: >
            {% set r = states('sensor.wp_statusblock').split(',') | map('int', -1) | list %}
            {{ r[21] if r | length == 24 and r[12] == 1 else this.attributes.get('schaltzustand_i51') }}
          ausfaelle_i52: >
            {% set r = states('sensor.wp_statusblock').split(',') | map('int', -1) | list %}
            {{ r[22] | bitwise_and(49151) if r | length == 24 and r[12] == 1 else this.attributes.get('ausfaelle_i52') }}
          unterbrechungen_i53: >
            {% set r = states('sensor.wp_statusblock').split(',') | map('int', -1) | list %}
            {{ r[23] if r | length == 24 and r[12] == 1 else this.attributes.get('unterbrechungen_i53') }}
      - name: "Wärmepumpe Verdichterleistung"
        unique_id: waermepumpe_verdichterleistung
        icon: mdi:gauge
        unit_of_measurement: "%"
        state_class: measurement
        state: >
          {% set p = states('sensor.wp_leistungsblock').split(',') | map('int', -1) | list %}
          {{ (p[7] / 10) | round(0) if p | length == 8 and p[5] > 0 else (this.state if is_number(this.state) else none) }}
      - name: "Wärmepumpe Pumpendrehzahl"
        unique_id: waermepumpe_pumpendrehzahl
        icon: mdi:pump
        unit_of_measurement: "%"
        state_class: measurement
        state: >
          {% set p = states('sensor.wp_leistungsblock').split(',') | map('int', -1) | list %}
          {{ (p[0] / 10) | round(0) if p | length == 8 and p[5] > 0 else (this.state if is_number(this.state) else none) }}
      # BMS switches I31 (cooling) / I32 (hot water): 1 = on, 0 = off ("Man. Betrieb aus" on the display);
      # read-back for the holiday function
      - name: "Wärmepumpe BMS Kühlbetrieb"
        unique_id: waermepumpe_bms_i31
        icon: mdi:snowflake
        state: >
          {% set r = states('sensor.wp_statusblock').split(',') | map('int', -1) | list %}
          {{ r[1] if r | length == 24 and (r[0:13] | select('eq', 1) | list | length) >= 8
             else (this.state if is_number(this.state) else none) }}
      - name: "Wärmepumpe BMS Warmwasser"
        unique_id: waermepumpe_bms_i32
        icon: mdi:water-boiler
        state: >
          {% set r = states('sensor.wp_statusblock').split(',') | map('int', -1) | list %}
          {{ r[2] if r | length == 24 and (r[0:13] | select('eq', 1) | list | length) >= 8
             else (this.state if is_number(this.state) else none) }}
      # F codes (I52) and I codes (I53) as text, texts from the Waterkotte Modbus documentation (2017);
      # the history of these sensors shows which message was active when
      - name: "Wärmepumpe Störungen"
        unique_id: waermepumpe_stoerungen_text
        icon: >
          {{ 'mdi:check-circle-outline' if this.state in ['Keine', 'unknown', 'unavailable'] else 'mdi:alert-octagon' }}
        state: >
          {% set r = states('sensor.wp_statusblock').split(',') | map('int', -1) | list %}
          {% if r | length != 24 or (r[0:13] | select('eq', 1) | list | length) < 8 %}
            {{ this.state if this.state not in ['unknown', 'unavailable'] else none }}
          {% else %}
            {% set texts = {0: 'F100 Motorschutzschalter 1', 1: 'F101 Motorschutzschalter 2', 2: 'F102 Phasenfehler',
                            3: 'F103 Primärseite', 4: 'F110 HD-Pressostat', 5: 'F120 ND-Pressostat',
                            6: 'F121 Drucküberwachung Verdampfer', 7: 'F122 Temperaturüberwachung Verdampfer',
                            8: 'F123 Nasslauf', 9: 'F111 Verflüssigungstemperatur zu niedrig',
                            10: 'F104 Störung Sekundärseite', 11: 'F105 Motorschutzschalter 3',
                            12: 'F130 Ausfall 4-Wege-Ventil'} %}
            {% set ns = namespace(l=[]) %}
            {% for b, t in texts.items() if (r[22] | bitwise_and(2 ** b)) > 0 %}{% set ns.l = ns.l + [t] %}{% endfor %}
            {% if not ns.l and (r[22] | bitwise_and(32768)) > 0 %}{% set ns.l = ['Fxxx Sammelmeldung'] %}{% endif %}
            {% if not ns.l and (r[21] | bitwise_and(64)) > 0 %}{% set ns.l = ['Alarmausgang (ohne F-Code)'] %}{% endif %}
            {# own checks the heat pump does not detect, see "Eigene Störungen" below #}
            {% if is_state('binary_sensor.warmepumpe_warmwasser_zu_kalt', 'on') %}{% set ns.l = ns.l + ['Warmwasser > 2 h unter Soll − 10 K'] %}{% endif %}
            {% if is_state('binary_sensor.warmepumpe_heizkreis_zu_kalt', 'on') %}{% set ns.l = ns.l + ['Heizkreis > 2 h unter Soll − 3 K'] %}{% endif %}
            {% if is_state('binary_sensor.warmepumpe_evu_sperre_hangt', 'on') %}{% set ns.l = ns.l + ['EVU-Sperre > 75 min aktiv'] %}{% endif %}
            {{ ns.l | join(', ') if ns.l else 'Keine' }}
          {% endif %}
      - name: "Wärmepumpe Information"
        unique_id: waermepumpe_information_text
        icon: >
          {{ 'mdi:check-circle-outline' if this.state in ['Keine', 'unknown', 'unavailable'] else 'mdi:information-outline' }}
        state: >
          {% set r = states('sensor.wp_statusblock').split(',') | map('int', -1) | list %}
          {% if r | length != 24 or (r[0:13] | select('eq', 1) | list | length) < 8 %}
            {{ this.state if this.state not in ['unknown', 'unavailable'] else none }}
          {% else %}
            {% set texts = {0: 'I011 T Quelle aus < OK', 1: 'I012 p Kondensator > OK', 2: 'I013 Ext. Abschaltung (EVU)',
                            3: 'I014 Schalthäufigkeit Verdichter', 4: 'I014 Schalthäufigkeit Verdichter',
                            5: 'I014 Schalthäufigkeit ext. Wärmeerzeuger', 6: 'I015 T Quelle aus ERR',
                            7: 'I501 Vorlauftemperaturgrenzwert im Kühlkreis unterschritten',
                            8: 'I502 Rücklauftemperaturgrenzwert im Kühlkreis unterschritten',
                            9: 'I019 Stillstandszeit Verdichter', 10: 'I019 Stillstandszeit Verdichter',
                            11: 'I019 Stillstandszeit Verdichter', 12: 'I019 Stillstandszeit Verdichter',
                            13: 'I014 Schalthäufigkeit Verdichter', 14: 'I014 Schalthäufigkeit Verdichter'} %}
            {% set ns = namespace(l=[]) %}
            {% for b, t in texts.items() if (r[23] | bitwise_and(2 ** b)) > 0 and t not in ns.l %}{% set ns.l = ns.l + [t] %}{% endfor %}
            {% if not ns.l and (r[23] | bitwise_and(32768)) > 0 %}{% set ns.l = ['Ixxx Sammelmeldung'] %}{% endif %}
            {{ ns.l | join(', ') if ns.l else 'Keine' }}
          {% endif %}
  - trigger:
      - trigger: state
        entity_id:
          - sensor.wp_warmwasserblock
          - sensor.wp_kennlinienblock
          - sensor.wp_kuhlblock
          - sensor.wp_heizen_schaltdifferenz
          - sensor.warmepumpe_heizkreis_soll
    sensor:
      - name: "Wärmepumpe Warmwasser Sollwert"
        unique_id: waermepumpe_ww_sollwert_a38
        unit_of_measurement: "°C"
        device_class: temperature
        state: >
          {% set r = states('sensor.wp_warmwasserblock').split(',') | map('float', 0) | list %}
          {{ (r[1] / 10) | round(1) if r | length == 2 and r[0] > 0 and r[1] > 0
             else (this.state if is_number(this.state) else none) }}
      - name: "Wärmepumpe Kennlinie Heizkreis Norm"
        unique_id: waermepumpe_kl_a92
        unit_of_measurement: "°C"
        device_class: temperature
        state: >
          {% set r = states('sensor.wp_kennlinienblock').split(',') | map('float', 0) | list %}
          {{ (r[1] / 10) | round(1) if r | length == 6 and r[0] < 0 and r[4] > 0
             else (this.state if is_number(this.state) else none) }}
      - name: "Wärmepumpe Kennlinie Heizgrenze"
        unique_id: waermepumpe_kl_a93
        unit_of_measurement: "°C"
        device_class: temperature
        state: >
          {% set r = states('sensor.wp_kennlinienblock').split(',') | map('float', 0) | list %}
          {{ (r[2] / 10) | round(1) if r | length == 6 and r[0] < 0 and r[4] > 0
             else (this.state if is_number(this.state) else none) }}
      - name: "Wärmepumpe Kennlinie Heizgrenze Soll"
        unique_id: waermepumpe_kl_a94
        unit_of_measurement: "°C"
        device_class: temperature
        state: >
          {% set r = states('sensor.wp_kennlinienblock').split(',') | map('float', 0) | list %}
          {{ (r[3] / 10) | round(1) if r | length == 6 and r[0] < 0 and r[4] > 0
             else (this.state if is_number(this.state) else none) }}
      - name: "Wärmepumpe Kennlinie Norm-Außentemperatur"
        unique_id: waermepumpe_kl_a91
        unit_of_measurement: "°C"
        device_class: temperature
        state: >
          {% set r = states('sensor.wp_kennlinienblock').split(',') | map('float', 0) | list %}
          {{ (r[0] / 10) | round(1) if r | length == 6 and r[0] < 0 and r[4] > 0
             else (this.state if is_number(this.state) else none) }}
      - name: "Wärmepumpe Kennlinie Max Rücklauf"
        unique_id: waermepumpe_kl_a95
        unit_of_measurement: "°C"
        device_class: temperature
        state: >
          {% set r = states('sensor.wp_kennlinienblock').split(',') | map('float', 0) | list %}
          {{ (r[4] / 10) | round(1) if r | length == 6 and r[0] < 0 and r[4] > 0
             else (this.state if is_number(this.state) else none) }}
      - name: "Wärmepumpe Kennlinie Anpassung"
        unique_id: waermepumpe_kl_anpassung
        unit_of_measurement: "K"
        icon: mdi:tune-vertical
        state: >
          {% set r = states('sensor.wp_kennlinienblock').split(',') | map('float', 0) | list %}
          {% set a31 = states('sensor.warmepumpe_heizkreis_soll') %}
          {{ (a31 | float - r[5] / 10) | round(1) if r | length == 6 and r[0] < 0 and r[5] > 0 and is_number(a31)
             else (this.state if is_number(this.state) else none) }}
      # Kühlbetrieb (WP switches to cooling above the Kühlgrenze, 24 h outside temperature);
      # it cools once the return reaches Soll + Schaltdifferenz and then down to the Soll
      - name: "Wärmepumpe Kühlgrenze"
        unique_id: waermepumpe_kuehl_a108
        unit_of_measurement: "°C"
        device_class: temperature
        icon: mdi:snowflake-thermometer
        state: >
          {% set r = states('sensor.wp_kuhlblock').split(',') | map('float', 0) | list %}
          {{ (r[1] / 10) | round(1) if r | length == 3 and r[1] > 0 and r[2] > 0
             else (this.state if is_number(this.state) else none) }}
      - name: "Wärmepumpe Kühlkreis Soll"
        unique_id: waermepumpe_kuehl_a109
        unit_of_measurement: "°C"
        device_class: temperature
        icon: mdi:snowflake-thermometer
        state: >
          {% set r = states('sensor.wp_kuhlblock').split(',') | map('float', 0) | list %}
          {{ (r[2] / 10) | round(1) if r | length == 3 and r[1] > 0 and r[2] > 0
             else (this.state if is_number(this.state) else none) }}
      - name: "Wärmepumpe Kühlen Schaltdifferenz"
        unique_id: waermepumpe_kuehl_a107
        unit_of_measurement: "K"
        icon: mdi:arrow-expand-vertical
        state: >
          {% set r = states('sensor.wp_kuhlblock').split(',') | map('float', 0) | list %}
          {{ (r[0] / 10) | round(1) if r | length == 3 and r[1] > 0 and r[2] > 0
             else (this.state if is_number(this.state) else none) }}
      - name: "Wärmepumpe Heizen Schaltdifferenz"
        unique_id: waermepumpe_heiz_a61
        unit_of_measurement: "K"
        icon: mdi:arrow-expand-vertical
        state: >
          {% set r = states('sensor.wp_heizen_schaltdifferenz') %}
          {{ (r | float / 10) | round(1) if is_number(r) and r | float > 0
             else (this.state if is_number(this.state) else none) }}
  # Betriebsmodus as on the heat pump display: the WP chooses it from the 24 h outside temperature
  # (heating up to the Heizgrenze, cooling above the Kühlgrenze, neutral = only hot water in between);
  # shows "Urlaub" while the HA holiday function is active, the temperature mode stays in attribute "modus"
  - sensor:
      - name: "Wärmepumpe Betriebsmodus"
        unique_id: waermepumpe_betriebsmodus
        icon: >
          {% set t = states('sensor.warmepumpe_aussentemperatur_24h') %}
          {% set hg = states('sensor.warmepumpe_kennlinie_heizgrenze') %}
          {% set kg = states('sensor.warmepumpe_kuhlgrenze') %}
          {% if is_state('input_boolean.wp_urlaub_aktiv', 'on') %}mdi:beach
          {% elif not (is_number(t) and is_number(hg) and is_number(kg)) %}mdi:help-circle-outline
          {% elif t | float <= hg | float %}mdi:weather-cloudy
          {% elif t | float > kg | float %}mdi:weather-sunny
          {% else %}mdi:weather-partly-cloudy{% endif %}
        state: >
          {% set t = states('sensor.warmepumpe_aussentemperatur_24h') %}
          {% set hg = states('sensor.warmepumpe_kennlinie_heizgrenze') %}
          {% set kg = states('sensor.warmepumpe_kuhlgrenze') %}
          {% if is_state('input_boolean.wp_urlaub_aktiv', 'on') %}Urlaub
          {% elif not (is_number(t) and is_number(hg) and is_number(kg)) %}{{ none }}
          {% elif t | float <= hg | float %}Heizbetrieb
          {% elif t | float > kg | float %}Kühlbetrieb
          {% else %}Neutral{% endif %}
        attributes:
          modus: >
            {% set t = states('sensor.warmepumpe_aussentemperatur_24h') %}
            {% set hg = states('sensor.warmepumpe_kennlinie_heizgrenze') %}
            {% set kg = states('sensor.warmepumpe_kuhlgrenze') %}
            {% if not (is_number(t) and is_number(hg) and is_number(kg)) %}{{ none }}
            {% elif t | float <= hg | float %}Heizbetrieb
            {% elif t | float > kg | float %}Kühlbetrieb
            {% else %}Neutral{% endif %}
  # Eigene Störungen: hot water or heating not working. 2 h delay so that EVU locks and hot water charges
  # do not trigger them; shown in "Wärmepumpe Störungen"
  - binary_sensor:
      - name: "Wärmepumpe Warmwasser zu kalt"
        unique_id: waermepumpe_warmwasser_zu_kalt
        device_class: problem
        icon: mdi:water-boiler-alert
        delay_on: "02:00:00"
        state: >
          {% set ist = states('sensor.warmepumpe_warmwasser') %}
          {% set soll = states('sensor.warmepumpe_warmwasser_soll') %}
          {# not while hot water is switched off by BMS (I32 = 0, e.g. holiday) #}
          {{ is_number(ist) and is_number(soll) and ist | float < soll | float - 10
             and is_state('sensor.warmepumpe_bms_warmwasser', '1') }}
      # only in heating mode: in neutral / cooling mode the circuit is below the heating setpoint anyway
      - name: "Wärmepumpe Heizkreis zu kalt"
        unique_id: waermepumpe_heizkreis_zu_kalt
        device_class: problem
        icon: mdi:radiator-off
        delay_on: "02:00:00"
        state: >
          {% set ist = states('sensor.warmepumpe_heizkreis_ist') %}
          {% set soll = states('sensor.warmepumpe_heizkreis_soll') %}
          {{ is_state_attr('sensor.warmepumpe_betriebsmodus', 'modus', 'Heizbetrieb') and is_number(ist) and is_number(soll)
             and ist | float < soll | float - 3 }}
      # the time switch locks 30 / 30 / 60 min a day; longer means the heat pump missed the end of the lock
      - name: "Wärmepumpe EVU-Sperre hängt"
        unique_id: waermepumpe_evu_sperre_haengt
        device_class: problem
        icon: mdi:transmission-tower-off
        delay_on: "01:15:00"
        state: >
          {{ is_state('binary_sensor.warmepumpe_evu_sperre', 'on') }}
  # derived values: spread, temperatures only while water flows, deviation, cyclic measurement, defrost
  - sensor:
      - name: "Wärmepumpe Spreizung"
        unique_id: waermepumpe_spreizung
        unit_of_measurement: "K"
        state_class: measurement
        availability: >
          {% set v = states.binary_sensor.warmepumpe_verdichter %}
          {{ v is not none and v.state == 'on'
             and is_state('binary_sensor.warmepumpe_warmwasserbetrieb', 'off')
             and (now() - v.last_changed).total_seconds() > 300
             and (states.binary_sensor.warmepumpe_abtauung_erkannt is none
                  or (is_state('binary_sensor.warmepumpe_abtauung_erkannt', 'off')
                      and (now() - states.binary_sensor.warmepumpe_abtauung_erkannt.last_changed).total_seconds() > 180))
             and is_number(states('sensor.warmepumpe_vorlauf'))
             and is_number(states('sensor.warmepumpe_rucklauf'))
             and states('sensor.warmepumpe_vorlauf') | float >= states('sensor.warmepumpe_rucklauf') | float }}
        state: >
          {{ (states('sensor.warmepumpe_vorlauf') | float(0)
              - states('sensor.warmepumpe_rucklauf') | float(0)) | round(1) }}
      - name: "Wärmepumpe Vorlauf (Durchfluss)"
        unique_id: waermepumpe_vorlauf_durchfluss
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        availability: >
          {% set p = states.binary_sensor.warmepumpe_heizungspumpe %}
          {{ p is not none and p.state == 'on'
             and (now() - p.last_changed).total_seconds() > 60
             and (is_state('binary_sensor.warmepumpe_warmwasserbetrieb', 'off')
                  and (now() - states.binary_sensor.warmepumpe_warmwasserbetrieb.last_changed).total_seconds() > 180)
             and (is_state('binary_sensor.warmepumpe_abtauung_erkannt', 'off')
                  and (now() - states.binary_sensor.warmepumpe_abtauung_erkannt.last_changed).total_seconds() > 180)
             and is_number(states('sensor.warmepumpe_vorlauf')) }}
        state: "{{ states('sensor.warmepumpe_vorlauf') }}"
      - name: "Wärmepumpe Rücklauf (Durchfluss)"
        unique_id: waermepumpe_ruecklauf_durchfluss
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        availability: >
          {% set p = states.binary_sensor.warmepumpe_heizungspumpe %}
          {{ p is not none and p.state == 'on'
             and (now() - p.last_changed).total_seconds() > 60
             and (is_state('binary_sensor.warmepumpe_warmwasserbetrieb', 'off')
                  and (now() - states.binary_sensor.warmepumpe_warmwasserbetrieb.last_changed).total_seconds() > 180)
             and (is_state('binary_sensor.warmepumpe_abtauung_erkannt', 'off')
                  and (now() - states.binary_sensor.warmepumpe_abtauung_erkannt.last_changed).total_seconds() > 180)
             and is_number(states('sensor.warmepumpe_rucklauf')) }}
        state: "{{ states('sensor.warmepumpe_rucklauf') }}"
      - name: "Wärmepumpe Heizkreis Abweichung"
        unique_id: waermepumpe_heizkreis_abweichung
        unit_of_measurement: "K"
        state_class: measurement
        availability: >
          {{ is_number(states('sensor.warmepumpe_heizkreis_ist'))
             and is_number(states('sensor.warmepumpe_heizkreis_soll')) }}
        state: >
          {{ (states('sensor.warmepumpe_heizkreis_ist') | float
              - states('sensor.warmepumpe_heizkreis_soll') | float) | round(1) }}

  - binary_sensor:
      - name: "Wärmepumpe Zyklische Messung"
        unique_id: waermepumpe_zyklische_messung
        device_class: running
        state: >
          {% set p = states.binary_sensor.warmepumpe_heizungspumpe %}
          {% set v = states.binary_sensor.warmepumpe_verdichter %}
          {{ p is not none and v is not none and p.state == 'on' and v.state == 'off'
             and is_state('binary_sensor.warmepumpe_warmwasserbetrieb', 'off')
             and (now() - v.last_changed).total_seconds() > 240 }}
  - binary_sensor:
      - name: "Wärmepumpe Abtauung erkannt"
        unique_id: waermepumpe_abtauung_erkannt
        device_class: running
        delay_off: "00:02:00"
        state: >
          {{ is_state('binary_sensor.warmepumpe_verdichter', 'on')
             and is_state('binary_sensor.warmepumpe_warmwasserbetrieb', 'off')
             and is_number(states('sensor.warmepumpe_vorlauf')) and is_number(states('sensor.warmepumpe_rucklauf'))
             and states('sensor.warmepumpe_vorlauf') | float < states('sensor.warmepumpe_rucklauf') | float - 1.0 }}
  # operating state as on/off lanes for the "Betrieb" history card
  - binary_sensor:
      - name: "Wärmepumpe Heizen"
        unique_id: waermepumpe_heizen
        device_class: running
        icon: mdi:radiator
        state: "{{ is_state('sensor.warmepumpe_betriebszustand', 'Heizen') }}"
      - name: "Wärmepumpe Warmwasser"
        unique_id: waermepumpe_warmwasser
        device_class: running
        icon: mdi:water-boiler
        state: "{{ is_state('sensor.warmepumpe_betriebszustand', 'Warmwasser') }}"
      - name: "Wärmepumpe Kühlen"
        unique_id: waermepumpe_kuehlen
        device_class: running
        icon: mdi:snowflake
        state: "{{ is_state('sensor.warmepumpe_betriebszustand', 'Kühlen') }}"
  # yearly runtime for the long-term statistics (one bar per year)
  - sensor:
      - name: "Wärmepumpe Laufzeit Außengerät"
        unique_id: waermepumpe_laufzeit_aussengerat
        unit_of_measurement: "h"
        device_class: duration
        state_class: total_increasing
        availability: "{{ is_number(states('input_number.wp_laufzeit_aussengerat_jahr')) }}"
        state: "{{ states('input_number.wp_laufzeit_aussengerat_jahr') }}"
      - name: "Wärmepumpe Laufzeit Heizungspumpe"
        unique_id: waermepumpe_laufzeit_heizungspumpe
        unit_of_measurement: "h"
        device_class: duration
        state_class: total_increasing
        availability: "{{ is_number(states('input_number.wp_laufzeit_heizungspumpe_jahr')) }}"
        state: "{{ states('input_number.wp_laufzeit_heizungspumpe_jahr') }}"
      - name: "Wärmepumpe Laufzeit Heizen"
        unique_id: waermepumpe_laufzeit_heizen
        unit_of_measurement: "h"
        device_class: duration
        state_class: total_increasing
        availability: "{{ is_number(states('input_number.wp_laufzeit_heizen_jahr')) }}"
        state: "{{ states('input_number.wp_laufzeit_heizen_jahr') }}"
      - name: "Wärmepumpe Laufzeit Warmwasser"
        unique_id: waermepumpe_laufzeit_warmwasser
        unit_of_measurement: "h"
        device_class: duration
        state_class: total_increasing
        availability: "{{ is_number(states('input_number.wp_laufzeit_warmwasser_jahr')) }}"
        state: "{{ states('input_number.wp_laufzeit_warmwasser_jahr') }}"
      - name: "Wärmepumpe Laufzeit Kühlen"
        unique_id: waermepumpe_laufzeit_kuhlen
        unit_of_measurement: "h"
        device_class: duration
        state_class: total_increasing
        availability: "{{ is_number(states('input_number.wp_laufzeit_kuhlen_jahr')) }}"
        state: "{{ states('input_number.wp_laufzeit_kuhlen_jahr') }}"

  # BMS switches I30-I32 (Steuerung tab); I31/I32 are read back by sensors in the package
  - sensor:
      - name: "Wärmepumpe BMS Heizbetrieb"
        unique_id: waermepumpe_bms_i30
        icon: mdi:radiator
        state: >
          {% set r = states('sensor.wp_statusblock').split(',') | map('int', -1) | list %}
          {{ r[0] if r | length == 24 and (r[0:13] | select('eq', 1) | list | length) >= 8
             else (this.state if is_number(this.state) else none) }}
  - switch:
      - name: "Wärmepumpe Heizbetrieb"
        unique_id: waermepumpe_schalter_heizbetrieb
        icon: mdi:radiator
        availability: "{{ is_number(states('sensor.warmepumpe_bms_heizbetrieb')) }}"
        state: "{{ is_state('sensor.warmepumpe_bms_heizbetrieb', '1') }}"
        turn_on:
          - action: script.turn_on
            target:
              entity_id: script.wp_betrieb_schalten
            data:
              variables: {address: 158, value: 1}
        turn_off:
          - action: script.turn_on
            target:
              entity_id: script.wp_betrieb_schalten
            data:
              variables: {address: 158, value: 0}
      - name: "Wärmepumpe Kühlbetrieb"
        unique_id: waermepumpe_schalter_kuhlbetrieb
        icon: mdi:snowflake
        availability: "{{ is_number(states('sensor.warmepumpe_bms_kuhlbetrieb')) }}"
        state: "{{ is_state('sensor.warmepumpe_bms_kuhlbetrieb', '1') }}"
        turn_on:
          - action: script.turn_on
            target:
              entity_id: script.wp_betrieb_schalten
            data:
              variables: {address: 159, value: 1}
        turn_off:
          - action: script.turn_on
            target:
              entity_id: script.wp_betrieb_schalten
            data:
              variables: {address: 159, value: 0}
      - name: "Wärmepumpe Warmwasserbereitung"
        unique_id: waermepumpe_schalter_warmwasserbereitung
        icon: mdi:water-boiler
        availability: "{{ is_number(states('sensor.warmepumpe_bms_warmwasser')) }}"
        state: "{{ is_state('sensor.warmepumpe_bms_warmwasser', '1') }}"
        turn_on:
          - action: script.turn_on
            target:
              entity_id: script.wp_betrieb_schalten
            data:
              variables: {address: 160, value: 1}
        turn_off:
          - action: script.turn_on
            target:
              entity_id: script.wp_betrieb_schalten
            data:
              variables: {address: 160, value: 0}

