    icon: mdi:snowflake-thermometer
  wp_kuhlgrenze_vorgabe:
    name: WP Kühlgrenze Vorgabe
    min: 18.0
    max: 30.0
    step: 0.1
    mode: box
    unit_of_measurement: °C
    icon: mdi:snowflake-thermometer
  wp_kuhlen_schaltdifferenz_vorgabe:
    name: WP Kühlen Schaltdifferenz Vorgabe
    min: 0.5
    max: 5.0
    step: 0.1
    mode: box
    unit_of_measurement: K
    icon: mdi:arrow-expand-vertical

input_boolean:
  wp_urlaub_kuhlbetrieb_blockieren:
    name: WP Urlaub Kühlbetrieb blockieren
    icon: mdi:snowflake-off
  wp_urlaub_warmwasser_blockieren:
    name: WP Urlaub Warmwasser blockieren
    icon: mdi:water-boiler-off
  wp_urlaub_geplant:
    name: WP Urlaub geplant
    icon: mdi:calendar-check
  wp_urlaub_aktiv:
    name: WP Urlaub aktiv
    icon: mdi:beach
  wp_eingerichtet:
    name: WP eingerichtet
    icon: mdi:check

input_datetime:
  wp_urlaub_beginn:
    name: WP Urlaub Beginn
    has_date: true
    has_time: true
    icon: mdi:airplane-takeoff
  wp_urlaub_ende:
    name: WP Urlaub Ende
    has_date: true
    has_time: true
    icon: mdi:airplane-landing

input_text:
  wp_schreibstatus:
    name: WP Schreibstatus
    max: 255
    icon: mdi:swap-vertical

counter:
  wp_schreibversuche:
    name: WP Schreibversuche
    icon: mdi:counter
    initial: 0
    step: 1

# script.wp_benachrichtigen: all messages of the package go through this script. For push messages to a phone with
# the companion app, replace the action with
#     - action: notify.mobile_app_<your_phone>
#       data:
#         title: "{{ title }}"
#         message: "{{ message }}"
#         data: "{{ data | default({}) }}"
script:
  wp_benachrichtigen:
    alias: 'WP: Benachrichtigen'
    description: 'Alle Meldungen der Wärmepumpe laufen hierüber. Standard: Benachrichtigung in Home Assistant. Für Push aufs
      Handy die Aktion durch notify.mobile_app_<gerät> ersetzen (siehe Kommentar).'
    mode: queued
    icon: mdi:message-alert
    fields:
      title:
        description: Titel
      message:
        description: Text
      data:
        description: Zusatzdaten für notify (tag, clickAction, …)
    sequence:
    - action: persistent_notification.create
      data:
        title: '{{ title }}'
        message: '{{ message }}'
        notification_id: '{{ (data | default({})).get(''tag'', ''waermepumpe'') }}'
  wp_register_schreiben:
    alias: 'WP: Wert an Wärmepumpe schreiben'
    description: FC6 über mbproxy auf der pCOWeb, bis zu 30 s auf den Read-back warten, sonst einmal nachschreiben; danach
      Benachrichtigung.
    mode: queued
    icon: mdi:upload
    fields:
      address:
        description: Register (A-Nummer)
      value:
        description: Wert in °C
      sensor:
        description: Sensor zur Kontrolle
      label:
        description: Bezeichnung
      scale:
        description: Rohwert = Wert × scale (Standard 10; 1 für die BMS-Schalter I30–I32)
    sequence:
    - variables:
        raw: '{{ (value | float * (scale | default(10)) | float) | round(0) | int }}'
    - action: input_text.set_value
      target:
        entity_id: input_text.wp_schreibstatus
      data:
        value: ⏳ {{ label }} → {{ value }} … ({{ now().strftime('%H:%M') }})
    - repeat:
        sequence:
        - action: counter.increment
          target:
            entity_id: counter.wp_schreibversuche
        - action: modbus.write_register
          continue_on_error: true
          data:
            hub: waterkotte
            slave: 1
            address: '{{ address | int }}'
            value: '{{ raw }}'
        - wait_template: '{{ (states(sensor) | float(-999) - value | float) | abs < 0.05 }}'
          timeout:
            seconds: 30
          continue_on_timeout: true
        until: '{{ (states(sensor) | float(-999) - value | float) | abs < 0.05 or repeat.index >= 2 }}'
    - if:
      - condition: template
        value_template: '{{ (states(sensor) | float(-999) - value | float) | abs < 0.05 }}'
      then:
      - action: input_text.set_value
        target:
          entity_id: input_text.wp_schreibstatus
        data:
          value: ✅ {{ label }} = {{ value }} übernommen ({{ now().strftime('%d.%m. %H:%M') }})
      else:
      - action: input_text.set_value
        target:
          entity_id: input_text.wp_schreibstatus
        data:
          value: ❌ {{ label }} → {{ value }} nicht übernommen ({{ now().strftime('%d.%m. %H:%M') }})
      - action: script.wp_benachrichtigen
        data:
          title: Wärmepumpe
          message: '{{ label }} konnte nach 2 Versuchen nicht auf {{ value }} gesetzt werden (Wärmepumpe/Karte nicht erreichbar?).'
  wp_betrieb_schalten:
    alias: 'WP: Betrieb schalten'
    description: 'Schaltet Heizbetrieb (I30), Kühlbetrieb (I31) oder Warmwasserbereitung (I32) per BMS an (1) oder aus (0).
      Gesperrt, solange der Urlaub aktiv ist: die Urlaubsfunktion stellt I31/I32 am Ende selbst wieder her.'
    mode: queued
    icon: mdi:power
    fields:
      address:
        description: 158 = I30 Heizbetrieb, 159 = I31 Kühlbetrieb, 160 = I32 Warmwasserbereitung
      value:
        description: 1 = an, 0 = aus
    sequence:
    - variables:
        k:
          '158':
            sensor: sensor.warmepumpe_bms_heizbetrieb
            label: Heizbetrieb
          '159':
            sensor: sensor.warmepumpe_bms_kuhlbetrieb
            label: Kühlbetrieb
          '160':
            sensor: sensor.warmepumpe_bms_warmwasser
            label: Warmwasserbereitung
    - condition: template
      value_template: '{{ (address | int(0) | string) in k and value | int(-1) in [0, 1] }}'
    - if:
      - condition: or
        conditions:
        - condition: state
          entity_id: input_boolean.wp_urlaub_geplant
          state: 'on'
        - condition: state
          entity_id: input_boolean.wp_urlaub_aktiv
          state: 'on'
      then:
      - action: input_text.set_value
        target:
          entity_id: input_text.wp_schreibstatus
        data:
          value: '🔒 {{ k[address | int | string].label }} nicht geschaltet: Urlaub aktiv ({{ now().strftime(''%d.%m. %H:%M'')
            }})'
      - stop: Urlaub aktiv
    - action: script.wp_register_schreiben
      data:
        address: '{{ address | int }}'
        value: '{{ value | int }}'
        scale: 1
        sensor: '{{ k[address | int | string].sensor }}'
        label: '{{ k[address | int | string].label }}'
  wp_kennlinie_verschieben:
    alias: 'WP: Kennlinie verschieben'
    description: Verschiebt Heizkreis Norm (A92) und Heizgrenze Soll (A94) gemeinsam (Parallelverschiebung).
    mode: single
    icon: mdi:chart-line-variant
    fields:
      delta:
        description: Verschiebung in K, z. B. 0.5 oder -0.5
    sequence:
    - variables:
        n92: '{{ (states(''sensor.warmepumpe_kennlinie_heizkreis_norm'') | float + delta | float) | round(1) }}'
        n94: '{{ (states(''sensor.warmepumpe_kennlinie_heizgrenze_soll'') | float + delta | float) | round(1) }}'
    - condition: template
      value_template: '{{ 10 <= n92 <= 45 and 8 <= n94 <= 35 and n94 < n92 }}'
    - action: script.wp_register_schreiben
      data:
        address: 92
        value: '{{ n92 }}'
        sensor: sensor.warmepumpe_kennlinie_heizkreis_norm
        label: Kennlinie Heizkreis Norm
    - action: script.wp_register_schreiben
      data:
        address: 94
        value: '{{ n94 }}'
        sensor: sensor.warmepumpe_kennlinie_heizgrenze_soll
        label: Kennlinie Heizgrenze Soll
  wp_kennlinie_waermer:
    alias: Kennlinie wärmer
    icon: mdi:thermometer-plus
    mode: single
    sequence:
    - action: script.wp_kennlinie_verschieben
      data:
        delta: 0.5
  wp_kennlinie_kaelter:
    alias: Kennlinie kälter
    icon: mdi:thermometer-minus
    mode: single
    sequence:
    - action: script.wp_kennlinie_verschieben
      data:
        delta: -0.5
  wp_urlaub_starten:
    alias: 'WP: Urlaub starten'
    icon: mdi:airplane-takeoff
    mode: single
    description: 'Wie die Urlaubsfunktion der Steuerung: Heizkreis um die Temperaturabsenkung senken (Parallelverschiebung
      A92/A94), optional Kühlbetrieb (I31) und Warmwasser (I32) per BMS aus.'
    sequence:
    - condition: state
      entity_id: input_boolean.wp_urlaub_aktiv
      state: 'off'
    - action: input_number.set_value
      target:
        entity_id: input_number.wp_backup_heizkreis_norm
      data:
        value: '{{ states(''sensor.warmepumpe_kennlinie_heizkreis_norm'') | float }}'
    - action: input_number.set_value
      target:
        entity_id: input_number.wp_backup_heizgrenze_soll
      data:
        value: '{{ states(''sensor.warmepumpe_kennlinie_heizgrenze_soll'') | float }}'
    - action: input_number.set_value
      target:
        entity_id: input_number.wp_backup_bms_kuhlbetrieb
      data:
        value: '{{ states(''sensor.warmepumpe_bms_kuhlbetrieb'') | int(1) }}'
    - action: input_number.set_value
      target:
        entity_id: input_number.wp_backup_bms_warmwasser
      data:
        value: '{{ states(''sensor.warmepumpe_bms_warmwasser'') | int(1) }}'
    - action: input_boolean.turn_on
      target:
        entity_id: input_boolean.wp_urlaub_aktiv
    - if:
      - condition: template
        value_template: '{{ states(''input_number.wp_urlaub_temperaturabsenkung'') | float(0) != 0 }}'
      then:
      - action: script.wp_kennlinie_verschieben
        data:
          delta: '{{ states(''input_number.wp_urlaub_temperaturabsenkung'') | float }}'
    - if:
      - condition: state
        entity_id: input_boolean.wp_urlaub_kuhlbetrieb_blockieren
        state: 'on'
      - condition: state
        entity_id: sensor.warmepumpe_bms_kuhlbetrieb
        state: '1'
      then:
      - action: script.wp_register_schreiben
        data:
          address: 159
          value: 0
          scale: 1
          sensor: sensor.warmepumpe_bms_kuhlbetrieb
          label: 'Urlaub: Kühlbetrieb aus'
    - if:
      - condition: state
        entity_id: input_boolean.wp_urlaub_warmwasser_blockieren
        state: 'on'
      - condition: state
        entity_id: sensor.warmepumpe_bms_warmwasser
        state: '1'
      then:
      - action: script.wp_register_schreiben
        data:
          address: 160
          value: 0
          scale: 1
          sensor: sensor.warmepumpe_bms_warmwasser
          label: 'Urlaub: Warmwasser aus'
    - action: script.wp_benachrichtigen
      data:
        title: 'Wärmepumpe: Urlaub'
        message: 'Urlaub gestartet bis {{ states(''input_datetime.wp_urlaub_ende'') | as_datetime | as_local | as_timestamp
          | timestamp_custom(''%d.%m. %H:%M'') }}: Heizkreis {{ states(''input_number.wp_urlaub_temperaturabsenkung'') }}
          K{{ '', Kühlbetrieb aus'' if is_state(''sensor.warmepumpe_bms_kuhlbetrieb'', ''0'') }}{{ '', Warmwasser aus'' if
          is_state(''sensor.warmepumpe_bms_warmwasser'', ''0'') }}.'
        data:
          tag: wp_urlaub
  wp_urlaub_beenden:
    alias: 'WP: Urlaub beenden'
    icon: mdi:airplane-landing
    mode: single
    description: 'Stellt Kennlinie und BMS-Schalter wieder her. Erst wenn alles übernommen ist, wird der Urlaub ausgeschaltet;
      sonst versucht es „WP: Urlaub prüfen“ in 5 Minuten erneut.'
    sequence:
    - condition: state
      entity_id: input_boolean.wp_urlaub_aktiv
      state: 'on'
    - variables:
        kl_ok: '{{ states(''input_number.wp_backup_heizkreis_norm'') | float(0) > 0 }}'
        ww_was_off: '{{ is_state(''sensor.warmepumpe_bms_warmwasser'', ''0'') }}'
    - if:
      - condition: template
        value_template: '{{ kl_ok and (states(''sensor.warmepumpe_kennlinie_heizkreis_norm'') | float(0) - states(''input_number.wp_backup_heizkreis_norm'')
          | float) | abs >= 0.05 }}'
      then:
      - action: script.wp_register_schreiben
        data:
          address: 92
          value: '{{ states(''input_number.wp_backup_heizkreis_norm'') | float }}'
          sensor: sensor.warmepumpe_kennlinie_heizkreis_norm
          label: 'Urlaub Ende: Heizkreis Sollwert Norm'
    - if:
      - condition: template
        value_template: '{{ kl_ok and (states(''sensor.warmepumpe_kennlinie_heizgrenze_soll'') | float(0) - states(''input_number.wp_backup_heizgrenze_soll'')
          | float) | abs >= 0.05 }}'
      then:
      - action: script.wp_register_schreiben
        data:
          address: 94
          value: '{{ states(''input_number.wp_backup_heizgrenze_soll'') | float }}'
          sensor: sensor.warmepumpe_kennlinie_heizgrenze_soll
          label: 'Urlaub Ende: Heizgrenze Soll'
    - if:
      - condition: template
        value_template: '{{ states(''sensor.warmepumpe_bms_kuhlbetrieb'') | int(-1) != states(''input_number.wp_backup_bms_kuhlbetrieb'')
          | int(1) }}'
      then:
      - action: script.wp_register_schreiben
        data:
          address: 159
          value: '{{ states(''input_number.wp_backup_bms_kuhlbetrieb'') | int(1) }}'
          scale: 1
          sensor: sensor.warmepumpe_bms_kuhlbetrieb
          label: 'Urlaub Ende: Kühlbetrieb'
    - if:
      - condition: template
        value_template: '{{ states(''sensor.warmepumpe_bms_warmwasser'') | int(-1) != states(''input_number.wp_backup_bms_warmwasser'')
          | int(1) }}'
      then:
      - action: script.wp_register_schreiben
        data:
          address: 160
          value: '{{ states(''input_number.wp_backup_bms_warmwasser'') | int(1) }}'
          scale: 1
          sensor: sensor.warmepumpe_bms_warmwasser
          label: 'Urlaub Ende: Warmwasser'
    - if:
      - condition: template
        value_template: '{{ (not kl_ok or ((states(''sensor.warmepumpe_kennlinie_heizkreis_norm'') | float(0) - states(''input_number.wp_backup_heizkreis_norm'')
          | float) | abs < 0.05 and (states(''sensor.warmepumpe_kennlinie_heizgrenze_soll'') | float(0) - states(''input_number.wp_backup_heizgrenze_soll'')
          | float) | abs < 0.05)) and states(''sensor.warmepumpe_bms_kuhlbetrieb'') | int(-1) == states(''input_number.wp_backup_bms_kuhlbetrieb'')
          | int(1) and states(''sensor.warmepumpe_bms_warmwasser'') | int(-1) == states(''input_number.wp_backup_bms_warmwasser'')
          | int(1) }}'
      then:
      - action: input_boolean.turn_off
        target:
          entity_id:
          - input_boolean.wp_urlaub_aktiv
          - input_boolean.wp_urlaub_geplant
      - action: script.wp_benachrichtigen
        data:
          title: 'Wärmepumpe: Urlaub'
          message: 'Urlaub beendet, Kennlinie und Schalter wiederhergestellt.{{ '' Warmwasser war aus: thermische Desinfektion
            am Display starten?'' if ww_was_off }}'
          data:
            tag: wp_urlaub
      else:
      - action: script.wp_benachrichtigen
        data:
          title: 'Wärmepumpe: Urlaub'
          message: Urlaub-Ende unvollständig (Werte nicht übernommen), neuer Versuch in 5 Minuten.
          data:
            tag: wp_urlaub

automation:
- id: wp_ww_soll_schreiben
  alias: 'WP: Warmwasser-Vorgabe schreiben'
  description: Schreibt die Warmwasser-Vorgabe 10 s nach der letzten Änderung, wenn sie vom Wert der Pumpe abweicht.
  mode: restart
  triggers:
  - trigger: state
    entity_id: input_number.wp_warmwasser_soll_vorgabe
    for:
      seconds: 10
    not_from:
    - unknown
    - unavailable
    not_to:
    - unknown
    - unavailable
  conditions:
  - condition: template
    value_template: '{{ is_number(states(''sensor.warmepumpe_warmwasser_sollwert'')) and (states(''input_number.wp_warmwasser_soll_vorgabe'')
      | float - states(''sensor.warmepumpe_warmwasser_sollwert'') | float) | abs >= 0.25 }}'
  actions:
  - action: script.turn_on
    target:
      entity_id: script.wp_register_schreiben
    data:
      variables:
        address: 38
        value: '{{ states(''input_number.wp_warmwasser_soll_vorgabe'') | float }}'
        sensor: sensor.warmepumpe_warmwasser_sollwert
        label: Warmwasser Soll
- id: wp_ww_soll_nachziehen
  alias: 'WP: Warmwasser-Vorgabe nachziehen'
  description: Übernimmt Änderungen am Display (oder fehlgeschlagene Schreibversuche) in die Vorgabe, ohne zu schreiben.
  mode: restart
  triggers:
  - trigger: state
    entity_id: sensor.warmepumpe_warmwasser_sollwert
    for:
      seconds: 60
  - trigger: homeassistant
    event: start
  conditions:
  - condition: template
    value_template: '{{ is_number(states(''sensor.warmepumpe_warmwasser_sollwert'')) and not is_state(''script.wp_register_schreiben'',
      ''on'') and (states(''input_number.wp_warmwasser_soll_vorgabe'') | float(0) - states(''sensor.warmepumpe_warmwasser_sollwert'')
      | float) | abs >= 0.25 }}'
  actions:
  - action: input_number.set_value
    target:
      entity_id: input_number.wp_warmwasser_soll_vorgabe
    data:
      value: '{{ [40, [55, states(''sensor.warmepumpe_warmwasser_sollwert'') | float] | min] | max }}'
- id: wp_einstellung_schreiben
  alias: 'WP: Einstellungen schreiben'
  description: Schreibt eine geänderte Heiz- oder Kühl-Einstellung 10 s nach der letzten Änderung, wenn sie vom Wert der Pumpe
    abweicht.
  mode: queued
  triggers:
  - trigger: state
    entity_id: input_number.wp_heizgrenze_vorgabe
    for:
      seconds: 10
    id: '93'
    not_from:
    - unknown
    - unavailable
    not_to:
    - unknown
    - unavailable
  - trigger: state
    entity_id: input_number.wp_heizkreis_sollwert_norm_vorgabe
    for:
      seconds: 10
    id: '92'
    not_from:
    - unknown
    - unavailable
    not_to:
    - unknown
    - unavailable
  - trigger: state
    entity_id: input_number.wp_heizgrenze_soll_vorgabe
    for:
      seconds: 10
    id: '94'
    not_from:
    - unknown
    - unavailable
    not_to:
    - unknown
    - unavailable
  - trigger: state
    entity_id: input_number.wp_heizen_schaltdifferenz_vorgabe
    for:
      seconds: 10
    id: '61'
    not_from:
    - unknown
    - unavailable
    not_to:
    - unknown
    - unavailable
  - trigger: state
    entity_id: input_number.wp_kuhlkreis_soll_vorgabe
    for:
      seconds: 10
    id: '109'
    not_from:
    - unknown
    - unavailable
    not_to:
    - unknown
    - unavailable
  - trigger: state
    entity_id: input_number.wp_kuhlgrenze_vorgabe
    for:
      seconds: 10
    id: '108'
    not_from:
    - unknown
    - unavailable
    not_to:
    - unknown
    - unavailable
  - trigger: state
    entity_id: input_number.wp_kuhlen_schaltdifferenz_vorgabe
    for:
      seconds: 10
    id: '107'
    not_from:
    - unknown
    - unavailable
    not_to:
    - unknown
    - unavailable
  variables:
    k:
      '93':
        input: input_number.wp_heizgrenze_vorgabe
        sensor: sensor.warmepumpe_kennlinie_heizgrenze
        label: Heizgrenze außen
      '92':
        input: input_number.wp_heizkreis_sollwert_norm_vorgabe
        sensor: sensor.warmepumpe_kennlinie_heizkreis_norm
        label: Heizkreis Sollwert Norm
      '94':
        input: input_number.wp_heizgrenze_soll_vorgabe
        sensor: sensor.warmepumpe_kennlinie_heizgrenze_soll
        label: Heizgrenze Soll
      '61':
        input: input_number.wp_heizen_schaltdifferenz_vorgabe
        sensor: sensor.warmepumpe_heizen_schaltdifferenz
        label: Heizen Schaltdifferenz
      '109':
        input: input_number.wp_kuhlkreis_soll_vorgabe
        sensor: sensor.warmepumpe_kuhlkreis_soll
        label: Kühlkreis Soll
      '108':
        input: input_number.wp_kuhlgrenze_vorgabe
        sensor: sensor.warmepumpe_kuhlgrenze
        label: Kühlgrenze außen
      '107':
        input: input_number.wp_kuhlen_schaltdifferenz_vorgabe
        sensor: sensor.warmepumpe_kuhlen_schaltdifferenz
        label: Kühlen Schaltdifferenz
  conditions:
  - condition: state
    entity_id: input_boolean.wp_urlaub_aktiv
    state: 'off'
  - condition: template
    value_template: '{% set c = k[trigger.id] %}{{ is_number(states(c.sensor)) and (states(c.input) | float - states(c.sensor)
      | float) | abs >= 0.05 }}'
  actions:
  - action: script.turn_on
    target:
      entity_id: script.wp_register_schreiben
    data:
      variables:
        address: '{{ trigger.id | int }}'
        value: '{{ states(k[trigger.id].input) | float }}'
        sensor: '{{ k[trigger.id].sensor }}'
        label: '{{ k[trigger.id].label }}'
- id: wp_einstellung_nachziehen
  alias: 'WP: Einstellungen nachziehen'
  description: Übernimmt Änderungen am Display, durch die Urlaubsfunktion oder fehlgeschlagene Schreibversuche in die Heiz-
    und Kühl-Vorgaben, ohne zu schreiben.
  mode: queued
  triggers:
  - trigger: state
    entity_id:
    - sensor.warmepumpe_kennlinie_heizgrenze
    - sensor.warmepumpe_kennlinie_heizkreis_norm
    - sensor.warmepumpe_kennlinie_heizgrenze_soll
    - sensor.warmepumpe_heizen_schaltdifferenz
    - sensor.warmepumpe_kuhlkreis_soll
    - sensor.warmepumpe_kuhlgrenze
    - sensor.warmepumpe_kuhlen_schaltdifferenz
    for:
      seconds: 60
  - trigger: state
    entity_id: script.wp_register_schreiben
    to: 'off'
    for:
      seconds: 5
  - trigger: state
    entity_id: input_boolean.wp_urlaub_aktiv
    to: 'off'
    for:
      seconds: 5
  - trigger: homeassistant
    event: start
  conditions:
  - condition: state
    entity_id: script.wp_register_schreiben
    state: 'off'
  - condition: state
    entity_id: input_boolean.wp_urlaub_aktiv
    state: 'off'
  actions:
  - repeat:
      for_each:
      - input: input_number.wp_heizgrenze_vorgabe
        sensor: sensor.warmepumpe_kennlinie_heizgrenze
        min: 8.0
        max: 20.0
      - input: input_number.wp_heizkreis_sollwert_norm_vorgabe
        sensor: sensor.warmepumpe_kennlinie_heizkreis_norm
        min: 20.0
        max: 40.0
      - input: input_number.wp_heizgrenze_soll_vorgabe
        sensor: sensor.warmepumpe_kennlinie_heizgrenze_soll
        min: 18.0
        max: 30.0
      - input: input_number.wp_heizen_schaltdifferenz_vorgabe
        sensor: sensor.warmepumpe_heizen_schaltdifferenz
        min: 0.5
        max: 5.0
      - input: input_number.wp_kuhlkreis_soll_vorgabe
        sensor: sensor.warmepumpe_kuhlkreis_soll
        min: 18.0
        max: 25.0
      - input: input_number.wp_kuhlgrenze_vorgabe
        sensor: sensor.warmepumpe_kuhlgrenze
        min: 18.0
        max: 30.0
      - input: input_number.wp_kuhlen_schaltdifferenz_vorgabe
        sensor: sensor.warmepumpe_kuhlen_schaltdifferenz
        min: 0.5
        max: 5.0
      sequence:
      - if:
        - condition: template
          value_template: '{{ is_number(states(repeat.item.sensor)) and (states(repeat.item.input) | float(0) - states(repeat.item.sensor)
            | float) | abs >= 0.05 }}'
        then:
        - action: input_number.set_value
          target:
            entity_id: '{{ repeat.item.input }}'
          data:
            value: '{{ [repeat.item.min, [repeat.item.max, states(repeat.item.sensor) | float] | min] | max }}'
- id: wp_stoerung_melden
  alias: 'WP: Störung melden'
  description: Push-Nachricht, sobald „Wärmepumpe Störungen“ etwas anderes als „Keine“ zeigt, und wenn es wieder behoben ist.
  mode: queued
  triggers:
  - trigger: state
    entity_id: sensor.warmepumpe_storungen
    not_from:
    - unknown
    - unavailable
    not_to:
    - unknown
    - unavailable
  conditions:
  - condition: template
    value_template: '{{ trigger.from_state.state != trigger.to_state.state }}'
  actions:
  - if:
    - condition: template
      value_template: '{{ trigger.to_state.state != ''Keine'' }}'
    then:
    - action: script.wp_benachrichtigen
      data:
        title: 'Wärmepumpe: Störung'
        message: '{{ trigger.to_state.state }}'
        data:
          tag: wp_stoerung
          clickAction: /waerme-pumpe/uebersicht
          priority: high
          ttl: 0
    else:
    - action: script.wp_benachrichtigen
      data:
        title: 'Wärmepumpe: Störung behoben'
        message: '{{ trigger.from_state.state }} liegt nicht mehr an.'
        data:
          tag: wp_stoerung
          clickAction: /waerme-pumpe/uebersicht
- id: wp_laufzeit_zaehlen
  alias: 'WP: Betriebsstunden zählen'
  description: Zählt jede Minute 1/60 h zu den Betriebsstunden bzw. Jahreslaufzeiten, deren Signal gerade aktiv ist (Schaltzustand
    I51). Ersetzt die bei 16384 h stehengebliebenen Zähler der WWPR.
  mode: single
  triggers:
  - trigger: time_pattern
    minutes: /1
  actions:
  - if:
    - condition: template
      value_template: '{{ is_state(''binary_sensor.warmepumpe_verdichter'', ''on'') }}'
    then:
    - action: input_number.set_value
      target:
        entity_id: input_number.wp_betriebsstunden_aussengerat
      data:
        value: '{{ (states(''input_number.wp_betriebsstunden_aussengerat'') | float(0) + 1 / 60) | round(3) }}'
  - if:
    - condition: template
      value_template: '{{ is_state(''binary_sensor.warmepumpe_heizungspumpe'', ''on'') }}'
    then:
    - action: input_number.set_value
      target:
        entity_id: input_number.wp_betriebsstunden_heizungspumpe
      data:
        value: '{{ (states(''input_number.wp_betriebsstunden_heizungspumpe'') | float(0) + 1 / 60) | round(3) }}'
  - if:
    - condition: template
      value_template: '{{ is_state(''binary_sensor.warmepumpe_verdichter'', ''on'') }}'
    then:
    - action: input_number.set_value
      target:
        entity_id: input_number.wp_laufzeit_aussengerat_jahr
      data:
        value: '{{ (states(''input_number.wp_laufzeit_aussengerat_jahr'') | float(0) + 1 / 60) | round(3) }}'
  - if:
    - condition: template
      value_template: '{{ is_state(''binary_sensor.warmepumpe_heizungspumpe'', ''on'') }}'
    then:
    - action: input_number.set_value
      target:
        entity_id: input_number.wp_laufzeit_heizungspumpe_jahr
      data:
        value: '{{ (states(''input_number.wp_laufzeit_heizungspumpe_jahr'') | float(0) + 1 / 60) | round(3) }}'
  - if:
    - condition: template
      value_template: '{{ is_state(''binary_sensor.warmepumpe_verdichter'', ''on'') and is_state(''binary_sensor.warmepumpe_warmwasserbetrieb'',
        ''off'') and is_state(''binary_sensor.warmepumpe_kuhlbetrieb'', ''off'') }}'
    then:
    - action: input_number.set_value
      target:
        entity_id: input_number.wp_laufzeit_heizen_jahr
      data:
        value: '{{ (states(''input_number.wp_laufzeit_heizen_jahr'') | float(0) + 1 / 60) | round(3) }}'
  - if:
    - condition: template
      value_template: '{{ is_state(''binary_sensor.warmepumpe_verdichter'', ''on'') and is_state(''binary_sensor.warmepumpe_warmwasserbetrieb'',
        ''on'') }}'
    then:
    - action: input_number.set_value
      target:
        entity_id: input_number.wp_laufzeit_warmwasser_jahr
      data:
        value: '{{ (states(''input_number.wp_laufzeit_warmwasser_jahr'') | float(0) + 1 / 60) | round(3) }}'
  - if:
    - condition: template
      value_template: '{{ is_state(''binary_sensor.warmepumpe_verdichter'', ''on'') and is_state(''binary_sensor.warmepumpe_kuhlbetrieb'',
        ''on'') }}'
    then:
    - action: input_number.set_value
      target:
        entity_id: input_number.wp_laufzeit_kuhlen_jahr
      data:
        value: '{{ (states(''input_number.wp_laufzeit_kuhlen_jahr'') | float(0) + 1 / 60) | round(3) }}'
- id: wp_laufzeit_jahreswechsel
  alias: 'WP: Jahreslaufzeiten zum Jahreswechsel'
  description: 'Am 1.1. um 0:00: Jahreslaufzeiten (Außengerät, Heizungspumpe, Heizen, Warmwasser, Kühlen) ins Vorjahr übernehmen
    und auf 0 setzen.'
  mode: single
  triggers:
  - trigger: time
    at: 00:00:00
  conditions:
  - condition: template
    value_template: '{{ now().month == 1 and now().day == 1 }}'
  actions:
  - action: input_number.set_value
    target:
      entity_id: input_number.wp_laufzeit_aussengerat_vorjahr
    data:
      value: '{{ states(''input_number.wp_laufzeit_aussengerat_jahr'') | float(0) }}'
  - action: input_number.set_value
    target:
      entity_id: input_number.wp_laufzeit_aussengerat_jahr
    data:
      value: 0
  - action: input_number.set_value
    target:
      entity_id: input_number.wp_laufzeit_heizungspumpe_vorjahr
    data:
      value: '{{ states(''input_number.wp_laufzeit_heizungspumpe_jahr'') | float(0) }}'
  - action: input_number.set_value
    target:
      entity_id: input_number.wp_laufzeit_heizungspumpe_jahr
    data:
      value: 0
  - action: input_number.set_value
    target:
      entity_id: input_number.wp_laufzeit_heizen_vorjahr
    data:
      value: '{{ states(''input_number.wp_laufzeit_heizen_jahr'') | float(0) }}'
  - action: input_number.set_value
    target:
      entity_id: input_number.wp_laufzeit_heizen_jahr
    data:
      value: 0
  - action: input_number.set_value
    target:
      entity_id: input_number.wp_laufzeit_warmwasser_vorjahr
    data:
      value: '{{ states(''input_number.wp_laufzeit_warmwasser_jahr'') | float(0) }}'
  - action: input_number.set_value
    target:
      entity_id: input_number.wp_laufzeit_warmwasser_jahr
    data:
      value: 0
  - action: input_number.set_value
    target:
      entity_id: input_number.wp_laufzeit_kuhlen_vorjahr
    data:
      value: '{{ states(''input_number.wp_laufzeit_kuhlen_jahr'') | float(0) }}'
  - action: input_number.set_value
    target:
      entity_id: input_number.wp_laufzeit_kuhlen_jahr
    data:
      value: 0
- id: wp_urlaub_pruefen
  alias: 'WP: Urlaub prüfen'
  description: Startet bzw. beendet den Urlaub zum geplanten Zeitraum (alle 5 Minuten und nach dem Start von HA).
  mode: single
  triggers:
  - trigger: time_pattern
    minutes: /5
  - trigger: homeassistant
    event: start
  - trigger: state
    entity_id: input_boolean.wp_urlaub_geplant
  actions:
  - choose:
    - conditions:
      - condition: template
        value_template: '{% set b = states(''input_datetime.wp_urlaub_beginn'') | as_datetime | as_local %}{% set e = states(''input_datetime.wp_urlaub_ende'')
          | as_datetime | as_local %}{{ is_state(''input_boolean.wp_urlaub_geplant'', ''on'') and is_state(''input_boolean.wp_urlaub_aktiv'',
          ''off'') and b is not none and e is not none and b <= now() < e }}'
      sequence:
      - action: script.wp_urlaub_starten
    - conditions:
      - condition: template
        value_template: '{% set e = states(''input_datetime.wp_urlaub_ende'') | as_datetime | as_local %}{{ is_state(''input_boolean.wp_urlaub_aktiv'',
          ''on'') and (is_state(''input_boolean.wp_urlaub_geplant'', ''off'') or (e is not none and now() >= e)) }}'
      sequence:
      - action: script.wp_urlaub_beenden
- id: wp_einrichten
  alias: 'WP: Startwerte beim ersten Start'
  description: Setzt beim allerersten Start die Standardwerte der Urlaubsfunktion (−3 K, Kühlbetrieb und Warmwasser blockieren).
    Danach behält Home Assistant die eigenen Einstellungen.
  mode: single
  triggers:
  - trigger: homeassistant
    event: start
  conditions:
  - condition: state
    entity_id: input_boolean.wp_eingerichtet
    state: 'off'
  actions:
  - action: input_number.set_value
    target:
      entity_id: input_number.wp_urlaub_temperaturabsenkung
    data:
      value: -3
  - action: input_boolean.turn_on
    target:
      entity_id:
      - input_boolean.wp_urlaub_kuhlbetrieb_blockieren
      - input_boolean.wp_urlaub_warmwasser_blockieren
      - input_boolean.wp_eingerichtet
